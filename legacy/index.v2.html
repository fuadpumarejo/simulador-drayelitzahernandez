<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Simulador Dra. Yelitza Hernández</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  /* Tema único claro: blanco con morado. Idea: consultorio quirúrgico. El acento es el violeta de genciana del marcador de piel; los puntos anatómicos se dibujan como marcas de ese marcador. Barra fija, contenido en una columna, simulador a dos paneles. */
  --bg:#FBFAFE; --surface:#FFFFFF; --surface-2:#F5F2FB; --ink:#241B36; --muted:#6F6782; --line:#E6E0F1;
  --accent:#6A3FCF; --accent-ink:#FFFFFF; --accent-soft:#F1EBFC; --stage:#EEE9F8;
  --good:#1F7A5A; --warn:#9A5B06; --crit:#B3323A; --good-soft:#E2F2EC; --warn-soft:#F8ECD8; --crit-soft:#F8E1E3;
  --display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --body:"Albert Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(34,28,46,.06),0 6px 20px rgba(34,28,46,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:28px;line-height:1.15} h2{font-size:20px} h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.hide{display:none!important}

/* barra */
.bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px}
.mono{width:38px;height:38px;border-radius:50%;border:1.5px dashed var(--accent);display:grid;place-items:center;font-family:var(--display);color:var(--accent);font-size:15px;letter-spacing:.04em;flex:none}
.brand b{font-family:var(--display);font-weight:400;font-size:17px;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--muted);display:block}
.nav{display:flex;gap:4px}
.nav button{border:0;background:none;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--good);background:var(--good-soft);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.crit{color:var(--crit);background:var(--crit-soft);border-color:transparent}
.col{display:flex;flex-direction:column;gap:12px}
.in.ref{border-color:var(--warn);background:var(--warn-soft)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tl li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)}
.stage.present{position:fixed;inset:0;height:auto;z-index:40;border-radius:0;border:0}
.stage.present #anchors{display:none}

main{max-width:1240px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;min-height:40px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.in{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px;width:100%;min-height:40px}
textarea.in{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

/* lista */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.summary .card{padding:12px 14px}
.summary b{font-family:var(--display);font-weight:400;font-size:24px;display:block}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.pitem:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--surface-2);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-family:var(--display);border:1px solid var(--line)}
.pitem .name{font-weight:600;font-size:16px}
.pitem .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pitem .right{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.s-prog{background:var(--warn-soft);color:var(--warn)} .pill.s-real{background:var(--good-soft);color:var(--good)} .pill.s-desc{background:var(--crit-soft);color:var(--crit)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* simulador */
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;align-items:stretch}
.ph{flex:none;width:76px;border:2px solid transparent;border-radius:10px;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center;font-size:11px;color:var(--muted)}
.ph img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.ph[aria-pressed="true"]{color:var(--accent)} .ph[aria-pressed="true"] img{outline:2px solid var(--accent);outline-offset:1px}
.addph{flex:none;display:flex;flex-direction:column;gap:6px;justify-content:center}
.sim{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.stage{position:sticky;top:72px;z-index:5;background:var(--stage);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;height:min(74vh,780px);touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.stage.pan{cursor:grab}
.world{position:absolute;left:0;top:0;transform-origin:0 0;--inv:1}
.world img,.world canvas{position:absolute;left:0;top:0;display:block;max-width:none;pointer-events:none}
.anchor{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;transform:scale(var(--inv));border-radius:50%;border:2px dashed #C9B5FF;background:rgba(90,53,176,.25);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;cursor:move;touch-action:none;text-shadow:0 1px 2px #000}
.anchor::after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #000}
.anchor i{position:absolute;top:-16px;font-style:normal;background:#5A35B0;border-radius:8px;padding:0 5px;line-height:15px}
.splitline{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);pointer-events:none;transform:scaleX(var(--inv))}
.ring{position:absolute;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);display:none}
.hint{position:absolute;left:10px;right:10px;top:10px;background:rgba(106,63,207,.95);color:#fff;padding:9px 12px;border-radius:10px;font-weight:600;font-size:14px;pointer-events:none;text-align:center}
.stage-ui{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:8px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;pointer-events:none}
.stage-ui>*{pointer-events:auto}
.seg{display:inline-flex;background:rgba(255,255,255,.94);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);padding:7px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.splitrange{position:absolute;left:10%;right:10%;bottom:58px;pointer-events:auto}
.splitrange input{width:100%}
.tag{position:absolute;top:10px;padding:3px 9px;border-radius:6px;background:rgba(255,255,255,.94);border:1px solid var(--line);color:var(--accent);font-size:12px;font-weight:700;pointer-events:none}
.panel{display:flex;flex-direction:column;gap:12px}
.panel .card{padding:14px}
.mods{display:flex;flex-wrap:wrap;gap:6px}
.modbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600;min-height:34px}
.modbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.modbtn[aria-pressed="true"] .muted{color:inherit;opacity:.85}
.modbtn.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.sl label{font-weight:600;font-size:14px}
.sl output{font-size:13px;color:var(--muted)}
.sl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);height:28px}
.sl .ends{grid-column:1/-1;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-4px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.steps li{display:flex;gap:8px;align-items:center}
.steps li b{width:20px;height:20px;border-radius:50%;border:1.5px dashed var(--accent);display:grid;place-items:center;font-size:11px;color:var(--accent);flex:none}
.steps li.done{color:var(--muted)} .steps li.now{font-weight:700}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 4px;cursor:pointer;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;line-height:1.15;text-align:center}
.tool svg{width:20px;height:20px}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* plan */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .in{min-height:36px;padding:6px 8px}
.tbl .n{width:74px} .tbl .p{width:140px}
.scroll-x{overflow-x:auto}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.totals .card b{font-family:var(--display);font-weight:400;font-size:22px;display:block}
.totals .card.hl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .totals .card.hl .lbl{color:inherit;opacity:.8}

.toast{pointer-events:none;position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:92vw;box-shadow:var(--shadow)}
.modal{position:fixed;inset:0;background:rgba(15,12,22,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.modal video{width:100%;border-radius:10px;background:#000}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px}
@media (max-width:900px){
  .sim{grid-template-columns:1fr}
  .stage{height:46vh;top:6px}
  .splitrange{bottom:112px}
  .bar{position:static}
  h1{font-size:23px}
  .pitem{grid-template-columns:48px minmax(0,1fr)} .pitem .right{grid-column:2;align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap}
  .thumb{width:48px;height:48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <div class="mono" aria-hidden="true">YH</div>
    <div class="grow"><b id="brandName">Simulador de resultados</b><span id="brandSub">Dra. Yelitza Hernández</span></div>
  </div>
  <nav class="nav" aria-label="Secciones">
    <button type="button" data-act="nav" data-v="list" id="navList">Pacientes</button>
    <button type="button" data-act="nav" data-v="settings" id="navSet">Ajustes</button>
  </nav>
  <span class="chip" id="saveChip">Iniciando…</span>
</header>
<main id="app"></main>
<input type="file" id="fileCam" accept="image/*" capture="environment" class="hide" aria-label="Tomar foto">
<input type="file" id="fileLib" accept="image/*" class="hide" aria-label="Elegir foto">
<input type="file" id="fileBackup" accept=".json,application/json" class="hide" aria-label="Importar respaldo">
<div id="overlay"></div>

<script>
"use strict";
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const V={sub:(a,b)=>[a[0]-b[0],a[1]-b[1]],add:(a,b)=>[a[0]+b[0],a[1]+b[1]],mul:(a,k)=>[a[0]*k,a[1]*k],len:a=>Math.hypot(a[0],a[1]),
  norm:a=>{const l=Math.hypot(a[0],a[1])||1;return[a[0]/l,a[1]/l]},mid:(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2],ang:a=>Math.atan2(a[1],a[0]),
  up:ax=>{let p=[ax[1],-ax[0]];if(p[1]>0)p=[-p[0],-p[1]];return p}};
function toast(msg,ms=2800){let t=$('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function confirmBox(title,body,okLabel='Eliminar'){return new Promise(res=>{const o=$('#overlay');o.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="card"><h2>${esc(title)}</h2><div class="muted">${esc(body)}</div><div class="row" style="justify-content:flex-end"><button class="btn" id="cbNo" type="button">Cancelar</button><button class="btn primary" id="cbYes" type="button">${esc(okLabel)}</button></div></div></div>`;$('#cbNo').onclick=()=>{o.innerHTML='';res(false)};$('#cbYes').onclick=()=>{o.innerHTML='';res(true)};$('#cbYes').focus()})}
const fmtDate=d=>{if(!d)return'';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`};
const today=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function age(b){if(!b)return'';const d=new Date(b+'T00:00:00'),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a>=0&&a<130?a:''}
function money(v){const c=S.settings.currency||'COP';try{return new Intl.NumberFormat('es-CO',{style:'currency',currency:c,maximumFractionDigits:c==='COP'?0:2}).format(v||0)}catch(e){return'$ '+Math.round(v||0).toLocaleString('es-CO')}}
const hrs=(a,b)=>{const f=n=>String(+(+n).toFixed(2)).replace('.',',');return a===b?`${f(a)} h`:`${f(a)} a ${f(b)} h`};
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('imagen'));i.src=src})}
function b64FromBuf(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function bufFromB64(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}

/* ============ almacenamiento (en este dispositivo) ============ */
const Store=(()=>{
  let db=null;const mem={kv:new Map(),patients:new Map(),photos:new Map()};
  function open(){return new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;res(v)}};
    try{const r=indexedDB.open('yh-simulador',1);
      r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('patients',{keyPath:'id'});d.createObjectStore('photos',{keyPath:'id'}).createIndex('pid','patientId')};
      r.onsuccess=()=>{db=r.result;fin(true)};r.onerror=()=>fin(false);r.onblocked=()=>fin(false)}catch(e){fin(false)}
    setTimeout(()=>fin(!!db),3500)})}
  function run(store,mode,fn){return new Promise((res,rej)=>{try{const t=db.transaction(store,mode);const rq=fn(t.objectStore(store));t.oncomplete=()=>res(rq?rq.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))}catch(e){rej(e)}})}
  return{open,persistent:()=>!!db,
    get:(s,k)=>db?run(s,'readonly',o=>o.get(k)):Promise.resolve(mem[s].get(k)),
    put:(s,v,k)=>db?run(s,'readwrite',o=>k!==undefined?o.put(v,k):o.put(v)):Promise.resolve(void mem[s].set(k!==undefined?k:v.id,v)),
    del:(s,k)=>db?run(s,'readwrite',o=>o.delete(k)):Promise.resolve(void mem[s].delete(k)),
    all:s=>db?run(s,'readonly',o=>o.getAll()):Promise.resolve([...mem[s].values()]),
    photosOf:pid=>db?run('photos','readonly',o=>o.index('pid').getAll(pid)):Promise.resolve([...mem.photos.values()].filter(p=>p.patientId===pid)),
    clear:s=>db?run(s,'readwrite',o=>o.clear()):Promise.resolve(void mem[s].clear())}
})();

/* ============ catálogo y módulos de simulación ============ */
const C=(id,name,area,minH,maxH,ref)=>({id,name,area,minH,maxH,price:0,...(ref?{ref:true}:{})});
const AREAS=['Rostro','Mamas','Cuerpo','No quirúrgico','Otro'];
const DEFAULT_CATALOG=[
  C('rino','Rinoplastia','Rostro',3,4),C('blefaro','Blefaroplastia','Rostro',1,2),C('lifting','Lifting facial','Rostro',4,4),C('oto','Otoplastia','Rostro',1,2),
  C('cejas','Lifting de cejas','Rostro',1,2,1),C('cuello','Lifting de cuello','Rostro',2,3,1),C('mento','Mentoplastia','Rostro',1,2,1),C('bichec','Bichectomía','Rostro',.5,1,1),C('papada','Liposucción de papada','Rostro',1,1.5,1),C('lipLift','Lip lift','Rostro',1,1,1),

  const dragEnd=()=>{if(drag){drag=null;scheduleSave()}};stageEl.addEventListener('pointerup',dragEnd,true);stageEl.addEventListener('pointercancel',dragEnd,true);

  txt('PACIENTE',M,y,{sz:8,c:MU,b:1});y+=5;txt(p.name||'Sin nombre',M,y+1,{sz:14});y+=7;
  const info=[p.doc&&'Documento: '+p.doc,age(p.birth)!==''&&'Edad: '+age(p.birth)+' años',p.phone&&'Tel.: '+p.phone,p.email].filter(Boolean).join('   ·   ');if(info){txt(info,M,y,{sz:9,c:MU});y+=5}
  txt('Fecha estimada del procedimiento: '+(p.date?fmtDate(p.date):'por definir'),M,y,{sz:10});y+=9;
  if(photos.length){txt('SIMULACIÓN DE RESULTADOS',M,y,{sz:8,c:MU,b:1});y+=4;
    for(const ph of photos){let w=(CW-6)/2,h=w*ph.h/ph.w;if(h>100){h=100;w=h*ph.w/ph.h}need(h+14);const x1=M+((CW-6)/2-w)/2,x2=M+(CW-6)/2+6+((CW-6)/2-w)/2;
      txt(ph.label,M,y+4,{sz:10,b:1});y+=7;doc.addImage(ph.orig,'JPEG',x1,y,w,h,undefined,'FAST');doc.addImage(ph.after,'JPEG',x2,y,w,h,undefined,'FAST');y+=h+4;
      txt('Antes',x1+w/2,y,{sz:9,c:MU,al:'center'});txt('Simulación',x2+w/2,y,{sz:9,c:AC,b:1,al:'center'});y+=8}}
  need(30);txt('PROCEDIMIENTOS CONSIDERADOS',M,y,{sz:8,c:MU,b:1});y+=5;
  doc.setFillColor(236,230,248);doc.rect(M,y-4,CW,7,'F');txt('Concepto',M+2,y+.8,{sz:9,b:1});txt('Tiempo quirúrgico',128,y+.8,{sz:9,b:1,al:'center'});txt('Valor',PW-M-2,y+.8,{sz:9,b:1,al:'right'});y+=8;
  for(const it of p.plan||[]){const noteL=it.note?doc.splitTextToSize(T(it.note),CW-70):[];need(8+noteL.length*4);txt(it.name,M+2,y,{sz:10});txt(it.extra?'':it.ns?'En consultorio':hrs(+it.minH||0,+it.maxH||0),128,y,{sz:10,al:'center'});txt(+it.price?money(+it.price):'Por definir',PW-M-2,y,{sz:10,al:'right'});y+=4.5;
    if(noteL.length){doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...MU);doc.text(noteL,M+2,y);y+=noteL.length*4}doc.setDrawColor(221,216,230);doc.setLineWidth(.2);doc.line(M,y,PW-M,y);y+=5.5}
  if(!(p.plan||[]).length){txt('Sin procedimientos registrados.',M+2,y,{sz:10,c:MU});y+=7}
  need(30);txt('Tiempo quirúrgico total estimado',M+2,y,{sz:10});txt(t.nq?hrs(t.lo,t.hi):'-',PW-M-2,y,{sz:10,b:1,al:'right'});y+=6;
  if(t.disc){txt('Subtotal',M+2,y,{sz:10});txt(money(t.sub),PW-M-2,y,{sz:10,al:'right'});y+=6;txt(`Descuento (${+p.discount}%)`,M+2,y,{sz:10});txt('- '+money(t.disc),PW-M-2,y,{sz:10,al:'right'});y+=6}
  doc.setFillColor(...AC);doc.rect(M,y-4.5,CW,9,'F');txt('Total estimado',M+2,y+1.2,{sz:11,b:1,c:[255,255,255]});txt(t.sub?money(t.total):'Por definir',PW-M-2,y+1.2,{sz:11,b:1,c:[255,255,255],al:'right'});y+=12;
  txt(`Propuesta válida por ${+st.validity||30} días a partir de la fecha de emisión.`,M,y,{sz:9,c:MU});y+=7;
  if(p.planNotes){const L=doc.splitTextToSize(T(p.planNotes),CW);need(8+L.length*4.5);txt('OBSERVACIONES',M,y,{sz:8,c:MU,b:1});y+=5;doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(...INK);doc.text(L,M,y);y+=L.length*4.5+4}
  const LG=doc.splitTextToSize(T(st.legal||''),CW);need(LG.length*3.8+30);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...MU);doc.text(LG,M,y);y+=LG.length*3.8+16;
  doc.setDrawColor(...INK);doc.setLineWidth(.2);doc.line(M,y,M+70,y);doc.line(PW-M-70,y,PW-M,y);txt(st.doctor||'Profesional',M,y+4.5,{sz:9});txt('Paciente',PW-M-70,y+4.5,{sz:9});
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);txt([st.clinic,st.city,st.contact].filter(Boolean).join('  ·  '),M,PH-9,{sz:8,c:MU});txt(`Página ${i} de ${n}`,PW-M,PH-9,{sz:8,c:MU,al:'right'})}
  await saveFile(`propuesta-${slug(p.name)}-${today()}.pdf`,doc.output('blob'))}
function xlsReady(){if(!window.XLSX){toast('El generador de Excel no cargó. Revisa la conexión y recarga.');return false}return true}
async function exportXLS(){
  const p=patient();if(!p||!xlsReady())return;const st=S.settings,X=window.XLSX,t=planTotals(p),plan=p.plan||[];
  const rows=[[st.tool],[[st.doctor,st.clinic].filter(Boolean).join(' · ')],[],['Paciente',p.name],['Documento',p.doc||''],['Teléfono',p.phone||''],['Correo',p.email||''],['Estado',p.status],['Fecha estimada',p.date?fmtDate(p.date):'Por definir'],['Emitida',fmtDate(today())],[],
    ['Concepto','Tipo','Horas mín.','Horas máx.','Valor ('+st.currency+')','Nota']];
  const r0=rows.length+1;for(const it of plan)rows.push([it.name,it.extra?'Adicional':it.ns?'No quirúrgico':'Procedimiento',it.extra||it.ns?'':+it.minH||0,it.extra||it.ns?'':+it.maxH||0,+it.price||0,it.note||'']);
  const r1=rows.length,has=plan.length>0;rows.push([]);
  rows.push(['Tiempo quirúrgico total (h)','',has?{t:'n',v:t.lo,f:`SUM(C${r0}:C${r1})`}:0,has?{t:'n',v:t.hi,f:`SUM(D${r0}:D${r1})`}:0]);
  const rs=rows.length+1;rows.push(['Subtotal','','','',has?{t:'n',v:t.sub,f:`SUM(E${r0}:E${r1})`}:0]);rows.push(['Descuento (%)','','','',+p.discount||0]);
  rows.push(['Total estimado','','','',{t:'n',v:t.total,f:`E${rs}*(1-E${rs+1}/100)`}]);if(p.planNotes){rows.push([]);rows.push(['Observaciones',p.planNotes])}
  const ws=X.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:34},{wch:14},{wch:11},{wch:11},{wch:18},{wch:44}];const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Propuesta');
  await saveFile(`plan-${slug(p.name)}-${today()}.xlsx`,new Blob([X.write(wb,{type:'array',bookType:'xlsx'})]))}
async function exportAllXLS(){if(!xlsReady())return;const X=window.XLSX;
  const rows=[['Paciente','Documento','Teléfono','Correo','Estado','Fecha estimada','Procedimientos','Horas mín.','Horas máx.','Subtotal','Descuento (%)','Total','Próximo contacto','Pendiente','Última actualización']];
  for(const p of S.patients){const t=planTotals(p);rows.push([p.name,p.doc||'',p.phone||'',p.email||'',p.status,p.date?fmtDate(p.date):'',(p.plan||[]).filter(i=>!i.extra).map(i=>i.name).join(', '),t.lo,t.hi,t.sub,+p.discount||0,t.total,p.nextDate?fmtDate(p.nextDate):'',p.nextNote||'',new Date(p.updatedAt||p.createdAt||Date.now()).toLocaleDateString('es-CO')])}
  const det=[['Paciente','Concepto','Tipo','Horas mín.','Horas máx.','Valor','Nota']];for(const p of S.patients)for(const it of p.plan||[])det.push([p.name,it.name,it.extra?'Adicional':it.ns?'No quirúrgico':'Procedimiento',it.extra||it.ns?'':+it.minH||0,it.extra||it.ns?'':+it.maxH||0,+it.price||0,it.note||'']);
  const seg=[['Paciente','Fecha','Tipo','Nota']];for(const p of S.patients)for(const j of p.journey||[])seg.push([p.name,fmtDate(j.date),j.type,j.note]);
  const wb=X.utils.book_new(),a=X.utils.aoa_to_sheet(rows),b=X.utils.aoa_to_sheet(det);a['!cols']=[{wch:28},{wch:14},{wch:14},{wch:24},{wch:18},{wch:14},{wch:40},{wch:10},{wch:10},{wch:14},{wch:12},{wch:14},{wch:16}];b['!cols']=[{wch:28},{wch:32},{wch:14},{wch:10},{wch:10},{wch:14},{wch:40}];
  X.utils.book_append_sheet(wb,a,'Pacientes');X.utils.book_append_sheet(wb,b,'Procedimientos');const c3=X.utils.aoa_to_sheet(seg);c3['!cols']=[{wch:28},{wch:12},{wch:22},{wch:60}];X.utils.book_append_sheet(wb,c3,'Seguimiento');await saveFile(`base-pacientes-${today()}.xlsx`,new Blob([X.write(wb,{type:'array',bookType:'xlsx'})]))}
async function exportBackup(){await flushSim();const photos=(await Store.all('photos')).map(ph=>({...ph,brush:ph.brush?b64FromBuf(new Float32Array(ph.brush).buffer):null}));
  await saveFile(`respaldo-simulador-${today()}.json`,new Blob([JSON.stringify({app:'yh-simulador',v:1,at:Date.now(),settings:S.settings,patients:S.patients,photos})]))}
async function importBackup(file){try{const d=JSON.parse(await file.text());if(d.app!=='yh-simulador'||!Array.isArray(d.patients))throw new Error('formato');
  if(!await confirmBox('Importar respaldo',`Se reemplazará la base actual por ${d.patients.length} paciente(s) del archivo.`,'Importar'))return;
  await Store.clear('patients');await Store.clear('photos');for(const p of d.patients)await Store.put('patients',p);for(const ph of d.photos||[]){if(ph.brush)ph.brush=new Float32Array(bufFromB64(ph.brush));await Store.put('photos',ph)}
  if(d.settings){S.settings={...structuredClone(DEFAULT_SETTINGS),...d.settings};await saveSettings()}S.patients=d.patients;S.view='list';ui.photoId=null;brand();render();toast('Respaldo importado.')}catch(e){console.error(e);toast('El archivo no es un respaldo válido de esta herramienta.')}}

/* ============ eventos ============ */
const acts={
  nav:async e=>{await flushSim();S.view=e.dataset.v;render()},
  newPatient:()=>{const p={id:uid(),name:'',doc:'',birth:'',phone:'',email:'',notes:'',status:'Valoración',date:'',discount:0,plan:[],createdAt:Date.now(),updatedAt:Date.now()};S.patients.push(p);Store.put('patients',p).catch(saveErr);S.pid=p.id;S.view='patient';S.tab='sim';ui.photoId=null;ui.mod='';render()},
  openPatient:e=>{S.pid=e.dataset.id;S.view='patient';S.tab='sim';ui.photoId=null;ui.mod='';render()},
  tab:async e=>{await flushSim();S.tab=e.dataset.t;renderPatient()},
  delPatient:async()=>{const p=patient();if(!await confirmBox('Eliminar paciente',`Se eliminarán la ficha, las fotos y el plan de ${p.name||'este paciente'}. No se puede deshacer.`))return;clearTimeout(ui.pending);ui.pending=null;for(const ph of await Store.photosOf(p.id))await Store.del('photos',ph.id);await Store.del('patients',p.id);S.patients=S.patients.filter(x=>x.id!==p.id);S.view='list';render()},
  takePhoto:()=>$('#fileCam').click(),pickPhoto:()=>$('#fileLib').click(),webcam:openWebcam,
  selPhoto:async e=>{await flushSim();ui.photoId=e.dataset.id;ui.mod='';$$('.ph').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===ui.photoId));openPhoto()},
  selMod:e=>{ui.mod=ui.mod===e.dataset.m?'':e.dataset.m;ui.placing=null;const ph=curPhoto();if(ui.mod&&!modPlaced(ph,ui.mod))ui.placing={mod:ui.mod,i:0};renderPanel();drawAnchors();setCmp('after')},
  place:()=>{if(ui.placing)return;const ph=curPhoto();modState(ph,ui.mod).a={};ui.placing={mod:ui.mod,i:0};Engine.recompute();Engine.render();renderPanel();drawAnchors();setCmp('after')},
  placeCancel:()=>{ui.placing=null;renderPanel();drawAnchors()},
  modReset:()=>{const ph=curPhoto();modState(ph,ui.mod).s={};simChanged();renderPanel()},
  tool:e=>{ui.tool=e.dataset.t;$$('.tool[data-t]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===ui.tool));setCmp('after')},
  undo:()=>{if(Engine.undo())scheduleSave();else toast('No hay trazos de pincel por deshacer.')},
  brushReset:()=>{Engine.resetBrush();scheduleSave()},
  cmp:e=>setCmp(e.dataset.c),
  present:()=>{const on=!stageEl.classList.contains('present');stageEl.classList.toggle('present',on);document.body.style.overflow=on?'hidden':'';$('#btnPresent',stageEl).textContent=on?'Salir':'Presentar';if(on){ui.placing=null;ui.tool='mover';updateHint();$$('.tool[data-t]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===ui.tool))}setCmp(on?'split':'after');requestAnimationFrame(fitView)},
  filter:e=>{S.filter=e.dataset.s;renderList()},
  setState:e=>{const p=patient();setStatus(p,e.dataset.s);renderPatient()},
  addJ:()=>{const p=patient(),note=$('#jNote').value.trim();if(!note){toast('Escribe una nota para el registro.');return}p.journey=p.journey||[];p.journey.push({id:uid(),date:$('#jDate').value||today(),type:$('#jType').value,note});savePatient(p);renderSeg(p)},
  delJ:e=>{const p=patient();p.journey=(p.journey||[]).filter(j=>j.id!==e.dataset.id);savePatient(p);renderSeg(p)},
  zoom:e=>{const d=+e.dataset.d;if(!d)return fitView();const r=stageEl.getBoundingClientRect();zoomAt(d>0?1.35:1/1.35,r.left+r.width/2,r.top+r.height/2)},
  saveImg:async()=>{const ph=curPhoto(),p=patient();const b=new Blob([bufFromB64(Engine.jpeg().split(',')[1])],{type:'image/jpeg'});await saveFile(`simulacion-${slug(p.name)}-${slug(ph.label)}.jpg`,b)},
  delPhoto:async()=>{const ph=curPhoto();if(!await confirmBox('Eliminar foto','Se eliminarán la foto y su simulación.'))return;clearTimeout(ui.pending);ui.pending=null;await Store.del('photos',ph.id);const p=patient();if(ui.photos[0]&&ui.photos[0].id===ph.id){p.thumb=null;savePatient(p)}ui.photoId=null;renderPatient()},
  addProc:e=>addProc(e.dataset.id),addProcSel:()=>addProc($('#procSel').value),
  addExtra:()=>{const p=patient();p.plan=p.plan||[];p.plan.push({uid:uid(),extra:true,name:'Concepto adicional',minH:0,maxH:0,price:0,note:''});savePatient(p);renderPlan(p)},
  delItem:e=>{const p=patient();p.plan=p.plan.filter(i=>i.uid!==e.dataset.u);savePatient(p);renderPlan(p)},
  pdf:exportPDF,xls:exportXLS,xlsAll:exportAllXLS,backup:exportBackup,restore:()=>$('#fileBackup').click(),
  catAdd:()=>{S.settings.catalog.push({id:uid(),name:'Nuevo procedimiento',area:'Otro',minH:1,maxH:2,price:0,mod:''});saveSettings();renderSettings()},
  catDel:e=>{S.settings.catalog=S.settings.catalog.filter(c=>c.id!==e.dataset.id);saveSettings();renderSettings()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=acts[b.dataset.act];if(f)Promise.resolve(f(b)).catch(err=>{console.error(err);toast('Ocurrió un error. Inténtalo de nuevo.')})});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){S.q=t.value;$('#plist').innerHTML=listHTML();return}
  if(t.dataset.p){const p=patient();if(!p)return;if(t.dataset.p==='status')setStatus(p,t.value);else p[t.dataset.p]=t.dataset.num?+t.value||0:t.value;savePatient(p);if(t.dataset.p==='name')$('#pName').textContent=p.name||'Paciente sin nombre';if(t.dataset.p==='status'){const s=$('#pState');s.textContent=p.status;s.className='pill '+(STATE_CLS[p.status]||'')}if(t.dataset.p==='discount')renderTotals(p);return}
  if(t.dataset.f){const p=patient(),it=p.plan.find(i=>i.uid===t.closest('tr').dataset.u);if(!it)return;it[t.dataset.f]=['minH','maxH','price'].includes(t.dataset.f)?+t.value||0:t.value;if(['minH','maxH'].includes(t.dataset.f)&&it.ref){delete it.ref;$$('.ref',t.closest('tr')).forEach(x=>x.classList.remove('ref'))}savePatient(p);renderTotals(p);return}
  if(t.dataset.s){const ph=curPhoto(),d=MODULES[ui.mod].sliders.find(x=>x.k===t.dataset.s),v=+t.value;modState(ph,ui.mod).s[d.k]=v;$('#o_'+d.k).textContent=(v>0&&d.min<0?'+':'')+v;stageEl.querySelector('#anchors').style.opacity=0;simChanged();return}
  if(t.id==='bsize'){ui.size=+t.value;$('#o_bsize').textContent=ui.size;return}
  if(t.id==='bpow'){ui.power=+t.value;$('#o_bpow').textContent=ui.power;return}
  if(t.dataset.st){S.settings[t.dataset.st]=t.dataset.num?+t.value||0:t.value;saveSettings();brand();return}
  if(t.dataset.cf){const c=S.settings.catalog.find(x=>x.id===t.closest('tr').dataset.c);if(!c)return;c[t.dataset.cf]=['minH','maxH','price'].includes(t.dataset.cf)?+t.value||0:t.value;if(['minH','maxH'].includes(t.dataset.cf)&&c.ref){delete c.ref;$$('.ref',t.closest('tr')).forEach(x=>x.classList.remove('ref'))}saveSettings();if(t.dataset.cf==='area')renderSettings();return}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fileCam'||t.id==='fileLib'){const f=t.files[0];t.value='';if(f)addPhotoFromBlob(f);return}
  if(t.id==='fileBackup'){const f=t.files[0];t.value='';if(f)importBackup(f);return}
  if(t.id==='phLabel'){const ph=curPhoto();ph.label=t.value;scheduleSave();const s=$(`.ph[data-id="${ph.id}"] span`);if(s)s.textContent=ph.label;return}
  if(t.id==='phPdf'){curPhoto().inPdf=t.checked;scheduleSave();return}
  if(t.dataset.s){stageEl.querySelector('#anchors').style.opacity=1;renderPanelMods()}});
function renderPanelMods(){const ph=curPhoto();if(!ph)return;$$('.modbtn').forEach(b=>b.classList.toggle('on',modActive(ph,b.dataset.m)))}
window.addEventListener('pagehide',()=>{if(ui.pending){clearTimeout(ui.pending);ui.pending=null;savePhotoNow()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ui.pending){clearTimeout(ui.pending);ui.pending=null;savePhotoNow()}});

/* ============ arranque ============ */
(async()=>{
  await Store.open();
  try{const s=await Store.get('kv','settings');if(s){S.settings={...structuredClone(DEFAULT_SETTINGS),...s};if((s.catalogV||1)<2){const have=new Set(S.settings.catalog.map(c=>c.id));for(const c of DEFAULT_CATALOG)if(!have.has(c.id))S.settings.catalog.push(structuredClone(c));S.settings.catalogV=2;await Store.put('kv',S.settings,'settings')}}S.patients=await Store.all('patients');
    if(!s){await Store.put('kv',S.settings,'settings');if(!S.patients.length)await seedDemo()}}catch(e){console.error(e)}
  brand();chipSaved();render();
  getDL();
})();
